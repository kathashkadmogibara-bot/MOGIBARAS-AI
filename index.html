<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mogibara-AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="authScreen">

  <div class="auth-card">

    <h1>🤖 Mogibara-AI</h1>
    <p>Your online AI</p>

    <div id="loginBox">

      <h2>Login</h2>

      <input id="loginEmail"
             type="email"
             placeholder="Email">

      <input id="loginPassword"
             type="password"
             placeholder="Password">

      <button onclick="login()">Login</button>

      <button class="secondary"
              onclick="showRegister()">
        Create Account
      </button>

    </div>


    <div id="registerBox" hidden>

      <h2>Create Account</h2>

      <input id="regName"
             placeholder="Name">

      <input id="regAge"
             type="number"
             placeholder="Age">

      <input id="regCity"
             placeholder="City">

      <input id="regAnime"
             placeholder="Favorite Anime">

      <input id="regEmail"
             type="email"
             placeholder="Email">

      <input id="regPassword"
             type="password"
             placeholder="Password">

      <button onclick="register()">
        Create Account
      </button>

      <button class="secondary"
              onclick="showLogin()">
        Back to Login
      </button>

    </div>

    <p id="authMessage"></p>

  </div>

</div>


<!-- MAIN APP -->
<div id="app" hidden>

  <header>

    <h1>🤖 Mogibara-AI</h1>

    <div>
      <button onclick="showProfile()">
        👤 Profile
      </button>

      <button onclick="openMaster()">
        👑 Master
      </button>

      <button onclick="logout()">
        Logout
      </button>
    </div>

  </header>


  <main>

    <!-- CHAT -->
    <section class="chat-section">

      <div id="messages"></div>

      <div class="chat-input">

        <input id="messageInput"
               placeholder="Talk to Mogibara-AI..."
               onkeydown="handleEnter(event)">

        <button onclick="sendMessage()">
          Send
        </button>

      </div>

    </section>


    <!-- SIDE PANEL -->
    <aside>

      <h2>👤 Profile</h2>

      <div id="profileInfo">
        Loading...
      </div>

      <hr>

      <h2>🎓 Teach AI</h2>

      <input id="teachQuestion"
             placeholder="Question">

      <textarea id="teachAnswer"
                placeholder="Answer"></textarea>

      <button onclick="teachAI()">
        🧠 Teach Mogibara
      </button>

    </aside>

  </main>

</div>


<!-- MASTER -->
<div id="masterPanel" hidden>

  <div class="master-card">

    <h1>👑 Master Control</h1>

    <button onclick="closeMaster()">
      Close
    </button>

    <hr>

    <button onclick="showUsers()">
      👤 Users
    </button>

    <button onclick="showKnowledge()">
      🧠 Knowledge
    </button>

    <button onclick="showTraining()">
      📚 Training
    </button>

    <button onclick="showStats()">
      📊 Statistics
    </button>

    <div id="masterContent"></div>

  </div>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
