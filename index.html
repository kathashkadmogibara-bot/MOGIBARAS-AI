<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOGIBARA AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel2:#21262d;
    --border:#30363d;
    --text:#f0f6fc;
    --muted:#8b949e;
    --accent:#58a6ff;
    --user:#1f6feb;
    --ai:#21262d;
    --danger:#f85149;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:64px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    flex-shrink:0;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:var(--accent);
    color:#07111f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:17px;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.status{
    font-size:12px;
    color:#3fb950;
    margin-top:2px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
}

.header-btn:hover{
    border-color:var(--accent);
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:24px 15px 30px;
    scroll-behavior:smooth;
}

.chat-inner{
    max-width:900px;
    margin:auto;
}

.message{
    display:flex;
    margin-bottom:20px;
    animation:appear .18s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--panel2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-right:9px;
    font-size:13px;
    font-weight:bold;
}

.user .avatar{
    order:2;
    margin-right:0;
    margin-left:9px;
    background:var(--user);
}

.bubble{
    max-width:min(75%,700px);
    padding:11px 14px;
    border-radius:12px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    border:1px solid var(--border);
}

.ai .bubble{
    background:var(--ai);
}

.user .bubble{
    background:var(--user);
    border-color:var(--user);
}

.time{
    font-size:10px;
    color:var(--muted);
    margin-top:5px;
}

/* WELCOME */

.welcome{
    text-align:center;
    padding:45px 15px;
}

.welcome-icon{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    background:var(--accent);
    color:#07111f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

.welcome h1{
    margin-top:18px;
    font-size:28px;
}

.welcome p{
    color:var(--muted);
    margin-top:8px;
}

.quick-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:22px;
}

.quick{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
}

.quick:hover{
    border-color:var(--accent);
}

/* TYPING */

.typing{
    display:none;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:13px;
    margin:0 auto 15px;
    max-width:900px;
}

.typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--muted);
    animation:dot 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes dot{
    0%,100%{
        opacity:.3;
    }
    50%{
        opacity:1;
    }
}

/* INPUT */

.input-area{
    border-top:1px solid var(--border);
    background:var(--panel);
    padding:12px 15px 14px;
    flex-shrink:0;
}

.input-inner{
    max-width:900px;
    margin:auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px;
}

.input-box:focus-within{
    border-color:var(--accent);
}

textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    line-height:1.4;
    min-height:24px;
    max-height:130px;
    padding:6px;
}

textarea::placeholder{
    color:var(--muted);
}

.send{
    width:42px;
    height:42px;
    border:none;
    border-radius:9px;
    background:var(--accent);
    color:#07111f;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.send:hover{
    filter:brightness(1.1);
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.hint{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:7px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:var(--bg);
}

::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#484f58;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-box{
    width:min(500px,100%);
    max-height:80vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.modal-box h2{
    margin-bottom:15px;
}

.memory-item{
    border:1px solid var(--border);
    background:var(--bg);
    padding:12px;
    border-radius:8px;
    margin-bottom:8px;
}

.memory-q{
    color:var(--accent);
    font-weight:bold;
}

.memory-a{
    margin-top:5px;
    color:var(--text);
}

.close{
    margin-top:12px;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:0 10px;
    }

    .title{
        font-size:16px;
    }

    .header-btn{
        padding:7px 9px;
        font-size:12px;
    }

    .chat{
        padding:18px 9px 25px;
    }

    .bubble{
        max-width:82%;
    }

    .welcome{
        padding:35px 10px;
    }

    .welcome h1{
        font-size:24px;
    }

    .input-area{
        padding:9px;
    }

    .hint{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo-area">

            <div class="logo">
                M
            </div>

            <div>
                <div class="title">
                    MOGIBARA AI
                </div>

                <div class="status" id="modeStatus">
                    ● NORMAL AI
                </div>
            </div>

        </div>

        <div class="header-buttons">

            <button class="header-btn" onclick="showMemory()">
                Memory
            </button>

            <button class="header-btn" onclick="clearChat()">
                Clear
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="chat-inner" id="chatInner">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    M
                </div>

                <h1>
                    MOGIBARA AI
                </h1>

                <p>
                    Your offline learning AI
                </p>

                <div class="quick-actions">

                    <button class="quick"
                        onclick="quickMessage('Hello')">
                        Hello
                    </button>

                    <button class="quick"
                        onclick="quickMessage('Who are you?')">
                        Who are you?
                    </button>

                    <button class="quick"
                        onclick="quickMessage('How are you?')">
                        How are you?
                    </button>

                    <button class="quick"
                        onclick="quickMessage('/pro')">
                        PRO AI
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- TYPING -->

    <div class="typing" id="typing">

        <b>AI</b>

        <span></span>
        <span></span>
        <span></span>

        thinking...

    </div>


    <!-- INPUT -->

    <section class="input-area">

        <div class="input-inner">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message MOGIBARA AI..."
                    autocomplete="off">
                </textarea>

                <button
                    class="send"
                    id="sendButton"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="hint">
                Enter to send • Shift + Enter for new line
            </div>

        </div>

    </section>

</div>


<!-- MEMORY MODAL -->

<div class="modal" id="memoryModal">

    <div class="modal-box">

        <h2>
            🧠 AI Memory
        </h2>

        <div id="memoryList"></div>

        <button
            class="close"
            onclick="closeMemory()">
            Close
        </button>

    </div>

</div>


<script>

/* =========================================
   MOGIBARA AI
   ========================================= */

let memory = JSON.parse(
    localStorage.getItem("mogibara_memory") || "{}"
);

let chatHistory = JSON.parse(
    localStorage.getItem("mogibara_chat") || "[]"
);

let aiMode = localStorage.getItem(
    "mogibara_mode"
) || "normal";


/* =========================================
   SAVE
   ========================================= */

function saveMemory(){

    localStorage.setItem(
        "mogibara_memory",
        JSON.stringify(memory)
    );
}


function saveChat(){

    localStorage.setItem(
        "mogibara_chat",
        JSON.stringify(chatHistory)
    );
}


/* =========================================
   NORMALIZE
   ========================================= */

function normalize(text){

    return String(text)
        .toLowerCase()
        .trim()
        .replace(/[?!,;:"']/g,"")
        .replace(/\s+/g," ");
}


/* =========================================
   MATH DETECTION
   ========================================= */

function isMath(text){

    if(
        /\d/.test(text) &&
        /[+\-*\/=%^()]/.test(text)
    ){
        return true;
    }

    return false;
}


/* =========================================
   ADD MEMORY
   ========================================= */

function learn(question, answer){

    question = normalize(question);

    if(!question || !answer){
        return;
    }

    if(!memory[question]){

        memory[question] = {
            answers:[],
            used:0
        };

    }

    if(
        !memory[question].answers.includes(answer)
    ){

        memory[question].answers.push(answer);

    }

    saveMemory();
}


/* =========================================
   GET MEMORY ANSWER
   ========================================= */

function getMemoryAnswer(question){

    question = normalize(question);

    let data = memory[question];

    if(
        !data ||
        !data.answers ||
        data.answers.length === 0
    ){
        return null;
    }

    let answers = data.answers;

    let answer =
        answers[Math.floor(Math.random() * answers.length)];

    data.used = (data.used || 0) + 1;

    saveMemory();

    return answer;
}


/* =========================================
   FUZZY MATCH
   ========================================= */

function similarity(a,b){

    if(a === b){
        return 1;
    }

    let A = new Set(a.split(" "));
    let B = new Set(b.split(" "));

    let common = 0;

    A.forEach(word => {

        if(B.has(word)){
            common++;
        }

    });

    let overlap =
        common / Math.max(A.size,B.size);

    return overlap;
}


function fuzzyAnswer(question){

    if(isMath(question)){
        return null;
    }

    let best = null;
    let bestScore = 0;

    for(let saved in memory){

        if(isMath(saved)){
            continue;
        }

        let score =
            similarity(question,saved);

        if(score > bestScore){

            bestScore = score;
            best = saved;

        }

    }

    if(best && bestScore >= 0.70){

        return getMemoryAnswer(best);

    }

    return null;
}


/* =========================================
   AI RESPONSE
   ========================================= */

function getAIResponse(message){

    let question = normalize(message);

    /* Exact memory */

    let exact =
        getMemoryAnswer(question);

    if(exact){
        return exact;
    }


    /* Commands */

    if(question === "who are you"){

        return "I am MOGIBARA AI, an offline learning AI created to learn from your conversations.";

    }


    if(
        question === "hello" ||
        question === "hi" ||
        question === "hey"
    ){

        return "Hello! 👋 How can I help you?";

    }


    if(question === "how are you"){

        return "I'm working perfectly! 🤖";

    }


    if(question === "good morning"){

        return "Good morning! ☀️";

    }


    if(question === "good night"){

        return "Good night! 🌙";

    }


    if(
        question.includes("your name")
    ){

        return "My name is MOGIBARA AI.";

    }


    /* PRO */

    if(aiMode === "pro"){

        let pro =
            fuzzyAnswer(question);

        if(pro){
            return pro;
        }

    }


    /* Normal safe fuzzy */

    let similar =
        fuzzyAnswer(question);

    if(similar){
        return similar;
    }


    return null;
}


/* =========================================
   ADD MESSAGE
   ========================================= */

function addMessage(type,text){

    let welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }

    let message =
        document.createElement("div");

    message.className =
        "message " + type;


    let avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "user" ? "U" : "AI";


    let container =
        document.createElement("div");


    let bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    let time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    container.appendChild(bubble);
    container.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(container);


    document
        .getElementById("chatInner")
        .appendChild(message);


    scrollChat();

}


/* =========================================
   SCROLL
   ========================================= */

function scrollChat(){

    let chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   SEND
   ========================================= */

function sendMessage(){

    let input =
        document.getElementById("messageInput");

    let message =
        input.value.trim();


    if(!message){
        return;
    }


    input.value = "";

    autoResize();


    addMessage(
        "user",
        message
    );


    chatHistory.push({
        user:message,
        time:Date.now()
    });


    saveChat();


    handleMessage(message);

}


/* =========================================
   HANDLE MESSAGE
   ========================================= */

function handleMessage(message){

    let command =
        message.trim().toLowerCase();


    /* PRO */

    if(command === "/pro"){

        aiMode = "pro";

        localStorage.setItem(
            "mogibara_mode",
            aiMode
        );

        updateMode();

        setTimeout(() => {

            addMessage(
                "ai",
                "PRO AI MODE ON. 🧠\nSmart pattern matching enabled."
            );

        },300);

        return;
    }


    /* NORMAL */

    if(command === "/normal"){

        aiMode = "normal";

        localStorage.setItem(
            "mogibara_mode",
            aiMode
        );

        updateMode();

        setTimeout(() => {

            addMessage(
                "ai",
                "NORMAL AI MODE ON."
            );

        },300);

        return;
    }


    /* MEMORY */

    if(command === "/memory"){

        showMemory();

        return;
    }


    /* CLEAR */

    if(command === "/clear"){

        clearChat();

        return;
    }


    /* HELP */

    if(command === "/help"){

        setTimeout(() => {

            addMessage(
                "ai",
`MOGIBARA AI COMMANDS

/pro       → PRO AI
/normal    → Normal AI
/memory    → Show memory
/clear     → Clear chat
/help      → Show commands`
            );

        },300);

        return;
    }


    /* NORMAL AI RESPONSE */

    showTyping(true);


    setTimeout(() => {

        showTyping(false);


        let response =
            getAIResponse(message);


        if(response){

            addMessage(
                "ai",
                response
            );

            return;
        }


        /* Unknown question */

        addMessage(
            "ai",
            "I don't know this yet. Teach me the answer."
        );


        setTimeout(() => {

            let answer =
                prompt(
                    "Teach MOGIBARA AI the answer:"
                );


            if(
                answer &&
                answer.trim()
            ){

                learn(
                    message,
                    answer.trim()
                );


                addMessage(
                    "ai",
                    "Learned successfully! 🧠"
                );

            }

        },100);

    },500);

}


/* =========================================
   TYPING
   ========================================= */

function showTyping(show){

    document
        .getElementById("typing")
        .style.display =
        show ? "flex" : "none";

    if(show){
        scrollChat();
    }

}


/* =========================================
   MODE
   ========================================= */

function updateMode(){

    let status =
        document.getElementById("modeStatus");

    if(aiMode === "pro"){

        status.textContent =
            "● PRO AI";

    }else{

        status.textContent =
            "● NORMAL AI";

    }

}


/* =========================================
   MEMORY UI
   ========================================= */

function showMemory(){

    let modal =
        document.getElementById("memoryModal");

    let list =
        document.getElementById("memoryList");

    list.innerHTML = "";


    let keys =
        Object.keys(memory);


    if(keys.length === 0){

        list.innerHTML =
            "<p>No learned memory yet.</p>";

    }else{

        keys.forEach(question => {

            let item =
                document.createElement("div");

            item.className =
                "memory-item";


            let q =
                document.createElement("div");

            q.className =
                "memory-q";

            q.textContent =
                question;


            let answers =
                memory[question].answers || [];


            let a =
                document.createElement("div");

            a.className =
                "memory-a";

            a.textContent =
                answers.join(" • ");


            item.appendChild(q);
            item.appendChild(a);

            list.appendChild(item);

        });

    }


    modal.style.display =
        "flex";

}


function closeMemory(){

    document
        .getElementById("memoryModal")
        .style.display =
        "none";

}


/* =========================================
   CLEAR CHAT
   ========================================= */

function clearChat(){

    if(
        !confirm(
            "Clear the chat? Learned memory will NOT be deleted."
        )
    ){
        return;
    }


    chatHistory = [];

    saveChat();


    let chatInner =
        document.getElementById("chatInner");

    chatInner.innerHTML = "";


    let welcome =
        document.createElement("div");

    welcome.className =
        "welcome";

    welcome.id =
        "welcome";


    welcome.innerHTML = `
        <div class="welcome-icon">M</div>
        <h1>MOGIBARA AI</h1>
        <p>Your offline learning AI</p>

        <div class="quick-actions">

            <button class="quick"
                onclick="quickMessage('Hello')">
                Hello
            </button>

            <button class="quick"
                onclick="quickMessage('Who are you?')">
                Who are you?
            </button>

            <button class="quick"
                onclick="quickMessage('How are you?')">
                How are you?
            </button>

            <button class="quick"
                onclick="quickMessage('/pro')">
                PRO AI
            </button>

        </div>
    `;


    chatInner.appendChild(welcome);

}


/* =========================================
   QUICK MESSAGE
   ========================================= */

function quickMessage(text){

    document
        .getElementById("messageInput")
        .value = text;

    sendMessage();

}


/* =========================================
   TEXTAREA AUTO RESIZE
   ========================================= */

function autoResize(){

    let textarea =
        document.getElementById("messageInput");

    textarea.style.height =
        "auto";

    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            130
        ) + "px";

}


/* =========================================
   KEYBOARD
   ========================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "input",
        autoResize
    );


document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================================
   LOAD OLD CHAT
   ========================================= */

function loadChat(){

    if(chatHistory.length === 0){
        return;
    }


    let welcome =
        document.getElementById("welcome");

    if(welcome){
        welcome.remove();
    }


    chatHistory.forEach(item => {

        if(item.user){

            addMessage(
                "user",
                item.user
            );

        }

        if(item.ai){

            addMessage(
                "ai",
                item.ai
            );

        }

    });

}


/* =========================================
   START
   ========================================= */

updateMode();

loadChat();

</script>

</body>
</html>
